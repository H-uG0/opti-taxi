# Local stack.
#   docker compose up --build                  demo: database, optimizer and web app with
#                                              fictitious data -> http://localhost:3100
#   docker compose up -d postgres optimizer    development (then pnpm dev, see README)
#   docker compose --profile osrm up -d osrm   (after ./infra/osrm/prepare.sh)
name: opti-taxi

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: optitaxi
      POSTGRES_PASSWORD: optitaxi
      POSTGRES_DB: optitaxi
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optitaxi -d optitaxi"]
      interval: 5s
      timeout: 3s
      retries: 20

  optimizer:
    build: ./services/optimizer
    environment:
      # Empty = straight-line estimate. With the osrm profile running: http://osrm:5000
      OSRM_URL: ${OSRM_URL:-}
      LOG_LEVEL: info
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Web app in production mode. On a fresh database it loads the fictitious data
  # set (seed), then simulates 20 past days in the background (apps/web/docker/start.sh).
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      optimizer:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://optitaxi:optitaxi@postgres:5432/optitaxi
      OPTIMIZER_URL: http://optimizer:8100
      GEOCODER_URL: https://data.geopf.fr/geocodage/search
      # 1: seed + history on an empty database. 0: start with an empty database.
      DEMO_DATA: "1"
    ports:
      - "3100:3100"
    init: true

  osrm:
    profiles: ["osrm"]
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    command: osrm-routed --algorithm mld --max-table-size 1000 /data/region.osrm
    ports:
      - "5050:5000"
    volumes:
      - ./infra/osrm/data:/data

volumes:
  pgdata:
